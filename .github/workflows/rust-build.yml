name: Build Rust Services

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rust-recall-service/**'
      - 'rust-proxy-service/**'
      - '.github/workflows/rust-build.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache target directory
      uses: actions/cache@v3
      with:
        path: |
          rust-recall-service/target
          rust-proxy-service/target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Build Recall Service
      working-directory: rust-recall-service
      run: cargo build --release --target x86_64-unknown-linux-gnu

    - name: Build Proxy Service
      working-directory: rust-proxy-service
      run: cargo build --release --target x86_64-unknown-linux-gnu

    - name: Package Binaries
      run: |
        mkdir -p dist
        cp rust-recall-service/target/x86_64-unknown-linux-gnu/release/rust-recall-service dist/
        cp rust-proxy-service/target/x86_64-unknown-linux-gnu/release/rust-proxy-service dist/
        cd dist
        tar -czf ../rust-services-linux-x64.tar.gz *

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rust-services-linux-x64
        path: rust-services-linux-x64.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - uses: actions/checkout@v3

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          rust-services-linux-x64/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
