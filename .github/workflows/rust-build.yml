name: Build Rust Services

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rust-recall-service/**'
      - 'rust-proxy-service/**'
      - '.github/workflows/rust-build.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: macos-x64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache target directory
      uses: actions/cache@v3
      with:
        path: |
          rust-recall-service/target
          rust-proxy-service/target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Build Recall Service
      working-directory: rust-recall-service
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build Proxy Service
      working-directory: rust-proxy-service
      run: cargo build --release --target ${{ matrix.target }}

    - name: Package Binaries (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        mkdir -p dist
        cp rust-recall-service/target/${{ matrix.target }}/release/rust-recall-service dist/
        cp rust-proxy-service/target/${{ matrix.target }}/release/rust-proxy-service dist/
        cd dist
        tar -czf ../rust-services-${{ matrix.artifact_name }}.tar.gz *

    - name: Package Binaries (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir dist
        copy rust-recall-service\target\${{ matrix.target }}\release\rust-recall-service.exe dist\
        copy rust-proxy-service\target\${{ matrix.target }}\release\rust-proxy-service.exe dist\
        Compress-Archive -Path dist\* -DestinationPath rust-services-${{ matrix.artifact_name }}.zip

    - name: Upload Artifacts (Linux/macOS)
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: rust-services-${{ matrix.artifact_name }}
        path: rust-services-${{ matrix.artifact_name }}.tar.gz

    - name: Upload Artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: rust-services-${{ matrix.artifact_name }}
        path: rust-services-${{ matrix.artifact_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - uses: actions/checkout@v3

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          rust-services-linux-x64/*.tar.gz
          rust-services-windows-x64/*.zip
          rust-services-macos-x64/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
