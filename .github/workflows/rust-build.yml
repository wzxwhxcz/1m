name: Build Rust Services

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rust-recall-service/**'
      - 'rust-proxy-service/**'
      - '.github/workflows/rust-build.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rust-services-linux-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rust-services-windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache target directory
      uses: actions/cache@v3
      with:
        path: |
          rust-proxy-service/target
          rust-recall-service/target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Build Proxy Service
      working-directory: rust-proxy-service
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build Recall Service
      working-directory: rust-recall-service
      run: cargo build --release --target ${{ matrix.target }}

    - name: Package Binaries (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p dist
        cp rust-proxy-service/target/${{ matrix.target }}/release/proxy-server dist/
        cp rust-recall-service/target/${{ matrix.target }}/release/recall-server dist/
        cd dist
        tar -czf ../${{ matrix.artifact_name }} *

    - name: Package Binaries (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist
        Copy-Item rust-proxy-service/target/${{ matrix.target }}/release/proxy-server.exe dist/
        Copy-Item rust-recall-service/target/${{ matrix.target }}/release/recall-server.exe dist/
        Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }}
        path: ${{ matrix.artifact_name }}

