version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: proxy-postgres
    environment:
      POSTGRES_DB: proxy_db
      POSTGRES_USER: proxy_user
      POSTGRES_PASSWORD: proxy_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxy_user -d proxy_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proxy-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  recall-service:
    image: ghcr.io/your-org/recall-service:latest
    container_name: proxy-recall
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://proxy_user:proxy_pass@postgres:5432/proxy_db
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust-proxy-service
    environment:
      # Database
      - DATABASE_URL=postgresql://proxy_user:proxy_pass@postgres:5432/proxy_db
      # Redis
      - REDIS_URL=redis://redis:6379
      # Recall Service
      - RECALL_SERVICE_URLS=http://recall-service:8082
      # Server
      - PROXY_PORT=8080
      - ADMIN_PORT=8081
      - RUST_LOG=info
      # JWT
      - JWT_SECRET=your-jwt-secret-change-in-production
      # Rate Limiting
      - RATE_LIMIT_PER_MINUTE=60
    ports:
      - "8080:8080"  # Proxy endpoint
      - "8081:8081"  # Admin API
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      recall-service:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
