[package]
name = "rust-recall-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Multi-tier cache (生产级缓存系统)
multi-tier-cache = { version = "0.6", features = ["full"] }

# FastEmbed (本地 embedding)
fastembed = "3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Metrics
prometheus = "0.13"
lazy_static = "1.4"

# Async
futures = "0.3"
async-trait = "0.1"

# Math & ML
ndarray = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# HTTP client (for remote embedding API)
reqwest = { version = "0.11", features = ["json"] }

# Utils
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "recall-server"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
