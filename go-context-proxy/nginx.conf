upstream go_backend {
    least_conn;
    server go-proxy-1:8080 max_fails=3 fail_timeout=30s;
    server go-proxy-2:8080 max_fails=3 fail_timeout=30s;
    server go-proxy-3:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name localhost;

    # Increase buffer sizes for large requests
    client_max_body_size 50M;
    client_body_buffer_size 1M;
    proxy_buffers 8 32k;
    proxy_buffer_size 64k;

    # Proxy API requests (with Service Key and URL-encoded upstream)
    location ~ ^/([^/]+)/(.+)/v1/chat/completions$ {
        proxy_pass http://go_backend;
        proxy_http_version 1.1;
        
        # Required for streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        
        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Admin API
    location /api/admin/ {
        proxy_pass http://go_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Metrics endpoint
    location /metrics {
        proxy_pass http://go_backend;
        proxy_http_version 1.1;
    }

    # Health check
    location /health {
        proxy_pass http://go_backend;
        proxy_http_version 1.1;
    }

    # Admin frontend (React static files)
    location /admin {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Root redirect
    location = / {
        return 301 /admin;
    }

    # Access and error logs
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}
