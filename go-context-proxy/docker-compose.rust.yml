version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: contextproxy-postgres
    environment:
      POSTGRES_DB: contextproxy
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: contextproxy_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d contextproxy"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - contextproxy-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: contextproxy-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - contextproxy-network

  # 🦀 Rust Recall Service - Instance 1 (NEW!)
  rust-recall-1:
    build:
      context: ../rust-recall-service
      dockerfile: Dockerfile
    container_name: contextproxy-rust-1
    environment:
      - REDIS_URL=redis://redis:6379
      - EMBEDDING_API_BASE=http://router.tumuer.me
      - EMBEDDING_API_KEY=your_api_key_here
      - EMBEDDING_MODEL=Qwen/Qwen3-Embedding-4B
      - PORT=8000
      - RUST_LOG=info
    ports:
      - "9100:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - contextproxy-network
    restart: unless-stopped

  # 🦀 Rust Recall Service - Instance 2 (NEW!)
  rust-recall-2:
    build:
      context: ../rust-recall-service
      dockerfile: Dockerfile
    container_name: contextproxy-rust-2
    environment:
      - REDIS_URL=redis://redis:6379
      - EMBEDDING_API_BASE=http://router.tumuer.me
      - EMBEDDING_API_KEY=your_api_key_here
      - EMBEDDING_MODEL=Qwen/Qwen3-Embedding-4B
      - PORT=8000
      - RUST_LOG=info
    ports:
      - "9101:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - contextproxy-network
    restart: unless-stopped

  # Python Recall Service - Instance 1 (保留用于对比测试)
  python-recall-1:
    build:
      context: ../context-matcher-test
      dockerfile: Dockerfile
    container_name: contextproxy-python-1
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8000
    ports:
      - "9000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - contextproxy-network
    restart: unless-stopped
    profiles:
      - python  # 仅在 --profile python 时启动

  # Python Recall Service - Instance 2 (保留用于对比测试)
  python-recall-2:
    build:
      context: ../context-matcher-test
      dockerfile: Dockerfile
    container_name: contextproxy-python-2
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8000
    ports:
      - "9001:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - contextproxy-network
    restart: unless-stopped
    profiles:
      - python  # 仅在 --profile python 时启动

  # Go Proxy Service - Instance 1
  go-proxy-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextproxy-go-1
    environment:
      - POSTGRES_URL=postgres://admin:contextproxy_pass_2026@postgres:5432/contextproxy?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - PYTHON_RECALL_URLS=http://rust-recall-1:8000,http://rust-recall-2:8000
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rust-recall-1:
        condition: service_healthy
      rust-recall-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - contextproxy-network
    restart: unless-stopped

  # Go Proxy Service - Instance 2
  go-proxy-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextproxy-go-2
    environment:
      - POSTGRES_URL=postgres://admin:contextproxy_pass_2026@postgres:5432/contextproxy?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - PYTHON_RECALL_URLS=http://rust-recall-1:8000,http://rust-recall-2:8000
      - PORT=8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rust-recall-1:
        condition: service_healthy
      rust-recall-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - contextproxy-network
    restart: unless-stopped

  # Go Proxy Service - Instance 3
  go-proxy-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextproxy-go-3
    environment:
      - POSTGRES_URL=postgres://admin:contextproxy_pass_2026@postgres:5432/contextproxy?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - PYTHON_RECALL_URLS=http://rust-recall-1:8000,http://rust-recall-2:8000
      - PORT=8080
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rust-recall-1:
        condition: service_healthy
      rust-recall-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - contextproxy-network
    restart: unless-stopped

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: contextproxy-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
    depends_on:
      - go-proxy-1
      - go-proxy-2
      - go-proxy-3
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - contextproxy-network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: contextproxy-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - contextproxy-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: contextproxy-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - contextproxy-network
    restart: unless-stopped

networks:
  contextproxy-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
