version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: context_proxy
      POSTGRES_USER: proxy_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proxy_pass_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 安全: 移除端口暴露，仅内部网络访问
    # ports:
    #   - "5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxy_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for Rust recall service cache)
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass_2024} --maxmemory 2gb --maxmemory-policy allkeys-lru
    # 安全: 移除端口暴露，仅内部网络访问
    # ports:
    #   - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rust Recall Service Instance 1
  rust-recall-1:
    build:
      context: ../rust-recall-service
      dockerfile: Dockerfile
    environment:
      PORT: 9100
      EMBEDDING_API_BASE: http://router.tumuer.me
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: Qwen/Qwen3-Embedding-4B
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2024}@redis:6379
      RUST_LOG: info
    ports:
      - "9100:9100"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Rust Recall Service Instance 2
  rust-recall-2:
    build:
      context: ../rust-recall-service
      dockerfile: Dockerfile
    environment:
      PORT: 9100
      EMBEDDING_API_BASE: http://router.tumuer.me
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: Qwen/Qwen3-Embedding-4B
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2024}@redis:6379
      RUST_LOG: info
    ports:
      - "9101:9100"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Rust Proxy Service Instance 1
  rust-proxy-1:
    build:
      context: ../rust-proxy-service
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      POSTGRES_URL: postgresql://proxy_user:${POSTGRES_PASSWORD:-proxy_pass_2024}@postgres:5432/context_proxy
      PYTHON_RECALL_URLS: http://rust-recall-1:9100,http://rust-recall-2:9100
      UPSTREAM_API_URL: https://api.openai.com/v1/chat/completions
      UPSTREAM_API_KEY: ${OPENAI_API_KEY}
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rust-recall-1:
        condition: service_healthy
      rust-recall-2:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 256M

  # Rust Proxy Service Instance 2
  rust-proxy-2:
    build:
      context: ../rust-proxy-service
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      POSTGRES_URL: postgresql://proxy_user:${POSTGRES_PASSWORD:-proxy_pass_2024}@postgres:5432/context_proxy
      PYTHON_RECALL_URLS: http://rust-recall-1:9100,http://rust-recall-2:9100
      UPSTREAM_API_URL: https://api.openai.com/v1/chat/completions
      UPSTREAM_API_KEY: ${OPENAI_API_KEY}
      RUST_LOG: info
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rust-recall-1:
        condition: service_healthy
      rust-recall-2:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 256M

  # Rust Proxy Service Instance 3
  rust-proxy-3:
    build:
      context: ../rust-proxy-service
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      POSTGRES_URL: postgresql://proxy_user:${POSTGRES_PASSWORD:-proxy_pass_2024}@postgres:5432/context_proxy
      PYTHON_RECALL_URLS: http://rust-recall-1:9100,http://rust-recall-2:9100
      UPSTREAM_API_URL: https://api.openai.com/v1/chat/completions
      UPSTREAM_API_KEY: ${OPENAI_API_KEY}
      RUST_LOG: info
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rust-recall-1:
        condition: service_healthy
      rust-recall-2:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 256M

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.pure-rust.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - rust-proxy-1
      - rust-proxy-2
      - rust-proxy-3
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.pure-rust.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    depends_on:
      - rust-proxy-1
      - rust-recall-1
    networks:
      - backend

  # Grafana
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
